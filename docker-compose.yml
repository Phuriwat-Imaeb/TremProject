# ฐานข้อมูล PostgreSQL 16 สำหรับพัฒนาบนเครื่อง/Codespaces
#   docker compose up -d     เปิด
#   docker compose down      ปิด (ข้อมูลยังอยู่ใน volume)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: petfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
