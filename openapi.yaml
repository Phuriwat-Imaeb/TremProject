openapi: 3.0.3
info:
  title: TremProject Seat Booking API
  description: |
    สัญญา API ของระบบจองที่นั่งรถทัวร์ / รถตู้
    วิชา 520342 Server Side Web Programming

    **กติการ่วมของทุกเส้นทาง**
    - ส่งและรับ JSON เสมอ ใช้ชื่อฟิลด์แบบ camelCase
    - รายการหลายชิ้นห่อไว้ใน `{"items": [...]}`
    - เส้นทางที่มีรูปกุญแจต้องแนบ `Authorization: Bearer <token>` ที่ได้จาก login (อายุ 1 ชั่วโมง)
    - ข้อผิดพลาดทุกกรณีมีหน้าตาเดียวกัน `{"error": {"code": "...", "message": "..."}}`
      ให้หน้าเว็บตัดสินใจจาก `code` และแสดง `message` (ภาษาไทย) ให้ผู้ใช้
    - ดูหรือยกเลิกการจองของคนอื่นไม่ได้ ระบบจะตอบ 404 เหมือนหาไม่เจอ (ไม่บอกว่ามีการจองนั้นอยู่)
    - เวลาส่งและรับเป็น ISO 8601 พร้อม offset ส่วน `date=YYYY-MM-DD` ใช้วันตามเวลาไทย (Asia/Bangkok)
    - เงินเป็นบาทจำนวนเต็ม (`priceBaht`, `totalBaht`)

    **บทบาท** member (ผู้โดยสาร สมัครเองได้), staff (พนักงาน แอดมินแต่งตั้ง), admin

    **ที่นั่งแบบสด (WebSocket)** หน้าเลือกที่นั่งต่อ `GET /api/trips/{id}/live` แบบ WebSocket
    เซิร์ฟเวอร์ส่ง `{"type": "seats", "tripId": 1, "taken": [1, 2, 5]}` ทันทีที่ต่อสำเร็จ
    และทุกครั้งที่มีคนจองหรือยกเลิกในรอบนั้น (ส่งรายการที่ไม่ว่างทั้งหมด หน้าเว็บวาดผังใหม่ได้เลย)
    ถ้าพนักงานยกเลิกทั้งรอบ จะได้ `{"type": "closed", "tripId": 1}` ให้หน้าเว็บโหลดสถานะรอบใหม่
    หน้าเว็บไม่ต้องส่งอะไรกลับ การจองยังทำผ่าน `POST /api/bookings` เหมือนเดิม

    **เฟสงาน** ดูได้จาก tag ของแต่ละเส้นทาง
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: เซิร์ฟเวอร์ Go บนเครื่องตัวเอง
  - url: http://localhost:4010
    description: ครัวปลอม Prism (npx -y @stoplight/prism-cli mock openapi.yaml -p 4010)

tags:
  - name: Auth
    description: "ทำแล้ว — สมัครสมาชิก เข้าสู่ระบบ ข้อมูลของฉัน"
  - name: Trips
    description: "เฟส 1 — เส้นทาง ค้นหารอบรถ ผังที่นั่ง"
  - name: Bookings
    description: "เฟส 1 — จองที่นั่ง การจองของฉัน ยกเลิก"
  - name: Live
    description: "เฟส 3 — ผังที่นั่งอัปเดตสดผ่าน WebSocket"
  - name: Articles
    description: "ทำแล้ว — ข่าว/ประกาศหน้าบ้าน"
  - name: Staff
    description: "เฟส 2 — หลังบ้านจัดการรอบรถและรายชื่อผู้โดยสาร (staff หรือ admin)"
  - name: Admin
    description: "หลังบ้าน เฉพาะ admin (สมาชิก บทความ ทำแล้ว / เส้นทาง คันรถ เฟส 2)"

paths:
  # ===================================================================
  # Auth
  # ===================================================================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: สมัครสมาชิก (ได้บทบาท member เสมอ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: สมัครสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: ข้อมูลไม่ครบหรือรูปแบบผิด (BAD_JSON, BAD_EMAIL, BAD_PASSWORD, BAD_NAME)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BAD_PASSWORD
                  message: รหัสผ่านต้องยาว 8 ตัวอักษรขึ้นไป และไม่เกิน 72 ไบต์
        "409":
          description: อีเมลนี้มีบัญชีแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: EMAIL_TAKEN
                  message: อีเมลนี้มีบัญชีอยู่แล้ว

  /api/auth/login:
    post:
      tags: [Auth]
      summary: เข้าสู่ระบบ รับตั๋ว JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadJSON"
        "401":
          description: อีเมลหรือรหัสผ่านผิด (ข้อความเหมือนกันทั้งสองกรณี)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BAD_CREDENTIALS
                  message: อีเมลหรือรหัสผ่านไม่ถูกต้อง

  /api/me:
    get:
      tags: [Auth]
      summary: ข้อมูลบัญชีของฉัน
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลสมาชิกเจ้าของตั๋ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/password:
    put:
      tags: [Auth]
      summary: เปลี่ยนรหัสผ่านของฉัน (ต้องใส่รหัสเดิมให้ถูก)
      description: ตั๋วใบเดิมยังใช้ได้จนหมดอายุ รหัสเดิมผิดตอบ 400 ไม่ใช่ 401 เพราะตั๋วยังถูกต้อง
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: เปลี่ยนแล้ว
        "400":
          description: ข้อมูลผิด (BAD_JSON, BAD_PASSWORD, SAME_PASSWORD, WRONG_PASSWORD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: WRONG_PASSWORD
                  message: รหัสผ่านเดิมไม่ถูกต้อง
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/bookings:
    get:
      tags: [Bookings]
      summary: การจองของฉัน ใหม่สุดก่อน (รวมที่ยกเลิกแล้วและรอบที่ออกไปแล้ว)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: การจองของเจ้าของตั๋ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "400":
          $ref: "#/components/responses/BadFilter"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===================================================================
  # Trips
  # ===================================================================
  /api/routes:
    get:
      tags: [Trips]
      summary: เส้นทางทั้งหมด (ไว้ทำดรอปดาวน์ ต้นทาง → ปลายทาง)
      responses:
        "200":
          description: เส้นทาง เรียงตาม id
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Route"

  /api/trips:
    get:
      tags: [Trips]
      summary: ค้นหารอบรถที่ยังเปิดขาย (ยังไม่ออก และไม่ถูกยกเลิก) เรียงตามเวลาออก
      parameters:
        - $ref: "#/components/parameters/RouteFilter"
        - $ref: "#/components/parameters/DateFilter"
      responses:
        "200":
          description: |
            รอบรถที่ตรงเงื่อนไข ไม่ส่ง date = ทุกรอบตั้งแต่ตอนนี้ไป (สูงสุด 50 รอบ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadFilter"

  /api/trips/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Trips]
      summary: รอบรถหนึ่งรอบ (รวมรอบที่ยกเลิกหรือออกไปแล้ว ไว้ให้หน้าตั๋วย้อนดูได้)
      responses:
        "200":
          description: รอบรถที่ขอ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadID"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trips/{id}/seats:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Trips]
      summary: ผังที่นั่งของรอบ บอกเฉพาะเลขที่ไม่ว่าง ไม่บอกว่าใครจอง
      description: |
        หน้าเว็บวาดที่นั่ง 1..seatCount ตาม kind (van 3 ที่ต่อแถว, bus 2+2 มีทางเดินกลาง)
        แล้วทำเครื่องหมายเลขที่อยู่ใน taken ว่าไม่ว่าง
      responses:
        "200":
          description: ผังที่นั่ง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatMap"
        "400":
          $ref: "#/components/responses/BadID"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trips/{id}/live:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Live]
      summary: "WebSocket: ผังที่นั่งแบบสด (ไม่ต้องเข้าสู่ระบบ)"
      description: |
        ต่อด้วย `new WebSocket("ws://<host>/api/trips/1/live")` (บน https ใช้ `wss://`)
        ข้อความจากเซิร์ฟเวอร์มีสองแบบ
        - `"type": "seats"` + SeatMap ส่งครั้งแรกทันทีที่ต่อสำเร็จ และส่งใหม่ทุกครั้งที่มีคนจอง/ยกเลิกในรอบนี้
        - `{"type": "closed", "tripId": 1}` เมื่อพนักงานยกเลิกทั้งรอบ
        Origin ของหน้าเว็บต้องอยู่ใน ALLOWED_ORIGINS (หรือเป็น host เดียวกับ API) ไม่งั้นได้ 403
      responses:
        "101":
          description: เปลี่ยนเป็น WebSocket สำเร็จ
        "400":
          $ref: "#/components/responses/BadID"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===================================================================
  # Bookings
  # ===================================================================
  /api/bookings:
    post:
      tags: [Bookings]
      summary: จองที่นั่ง (ได้ทีเดียวหลายที่ ในรอบเดียวกัน)
      description: |
        ทำทั้งหมดใน transaction เดียว ถ้าที่นั่งใดที่นั่งหนึ่งไม่ว่าง จะไม่จองให้สักที่
        ถ้าสองคนกดที่นั่งเดียวกันพร้อมกัน ฐานข้อมูลรับแค่คนแรก คนที่สองได้ 409 SEAT_TAKEN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBooking"
      responses:
        "201":
          description: จองสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: |
            ข้อมูลผิด (BAD_JSON, MISSING_FIELD) หรือรายการที่นั่งผิด BAD_SEATS
            (ว่าง, เกิน 10 ที่, เลขซ้ำกัน, เลขเกินจำนวนที่นั่งของรถ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BAD_SEATS
                  message: รถคันนี้มีที่นั่ง 1–13
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ไม่พบรอบรถ (tripId ไม่มีอยู่)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: ไม่พบรายการนี้
        "409":
          description: |
            SEAT_TAKEN มีที่นั่งถูกจองไปแล้ว (โหลดผังใหม่แล้วเลือกใหม่)
            TRIP_CLOSED รอบนี้ถูกยกเลิกหรือออกไปแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SEAT_TAKEN
                  message: ที่นั่ง 5 มีคนจองแล้ว

  /api/bookings/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Bookings]
      summary: การจองหนึ่งรายการ (ใช้แสดงหน้าตั๋ว) ของคนอื่นตอบ 404 ยกเว้น staff/admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: การจองที่ขอ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/bookings/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Bookings]
      summary: ยกเลิกการจองของฉัน ที่นั่งกลับมาว่างให้คนอื่นจองทันที
      description: ยกเลิกได้จนถึงเวลารถออก
      security:
        - bearerAuth: []
      responses:
        "200":
          description: การจองหลังยกเลิก (status = cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            WRONG_STATUS ยกเลิกไปแล้ว
            TRIP_CLOSED รถออกไปแล้ว ยกเลิกไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TRIP_CLOSED
                  message: รถออกไปแล้ว ยกเลิกไม่ได้

  # ===================================================================
  # Articles
  # ===================================================================
  /api/articles:
    get:
      tags: [Articles]
      summary: บทความที่เผยแพร่แล้ว (ค้นหา + แบ่งหน้า หน้าละ 10)
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: บทความ ใหม่สุดก่อน (ไม่มีฉบับร่าง)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"
        "400":
          $ref: "#/components/responses/BadFilter"

  /api/articles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Articles]
      summary: อ่านบทความหนึ่งเรื่อง (ฉบับร่างตอบ 404)
      responses:
        "200":
          description: บทความที่ขอ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadID"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===================================================================
  # Staff (staff หรือ admin ไม่ใช่ตอบ 403)
  # ===================================================================
  /api/staff/stats:
    get:
      tags: [Staff]
      summary: ตัวเลขของหน้าแดชบอร์ดหลังบ้าน (วันนี้นับตามเวลาไทย)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: การ์ดตัวเลข กราฟ 7 วัน การจองล่าสุด 6 รายการ และรอบที่จะออกถัดไป 5 รอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/staff/trips:
    get:
      tags: [Staff]
      summary: รอบรถทั้งหมด รวมที่ยกเลิกและออกไปแล้ว (แบ่งหน้า หน้าละ 10)
      description: ส่ง date = เรียงตามเวลาออกของวันนั้น ไม่ส่ง = รอบที่ออกล่าสุดก่อน
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteFilter"
        - $ref: "#/components/parameters/DateFilter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: รอบรถ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPage"
        "400":
          $ref: "#/components/responses/BadFilter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Staff]
      summary: เพิ่มรอบรถ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTrip"
      responses:
        "201":
          description: สร้างแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: |
            ข้อมูลไม่ครบ (MISSING_FIELD), เวลาออกอยู่ในอดีต (BAD_TIME),
            routeId หรือ vehicleId ไม่มีอยู่ (BAD_REF)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BAD_TIME
                  message: เวลาออกต้องเป็นเวลาในอนาคต
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/VehicleBusy"

  /api/staff/trips/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Staff]
      summary: แก้เวลาออกหรือราคา (เปลี่ยนเส้นทาง/คันรถไม่ได้ ยกเลิกแล้วสร้างใหม่แทน)
      description: เปลี่ยนราคาแล้วการจองเดิมยังจ่ายยอดเดิม (totalBaht เก็บไว้ตอนจอง)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripPatch"
      responses:
        "200":
          description: รอบรถหลังแก้ไข
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: ข้อมูลไม่ครบ (MISSING_FIELD) หรือเวลาออกอยู่ในอดีต (BAD_TIME)
          content:
