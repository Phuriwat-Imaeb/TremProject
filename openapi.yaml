        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    RouteFilter:
      name: routeId
      in: query
      description: กรองด้วย id ของเส้นทาง
      schema:
        type: integer
        minimum: 1
      example: 1
    DateFilter:
      name: date
      in: query
      description: วันที่ออกตามเวลาไทย รูปแบบ YYYY-MM-DD
      schema:
        type: string
        format: date
      example: "2026-10-21"
    Q:
      name: q
      in: query
      description: คำค้น หาในหัวข้อหรือเนื้อหา ไม่สนตัวพิมพ์เล็กใหญ่ ไม่เกิน 100 ตัวอักษร
      schema:
        type: string
        maxLength: 100
      example: หัวหิน
    Page:
      name: page
      in: query
      description: เลขหน้า เริ่มที่ 1 (ไม่ส่ง = หน้า 1) เกินหน้าสุดท้ายได้ items ว่าง
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

  responses:
    BadJSON:
      description: อ่านกล่อง JSON ไม่ออก
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_JSON
              message: อ่านกล่อง JSON ไม่ออก
    BadID:
      description: เลขใน path ไม่ใช่ตัวเลขบวก
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_ID
              message: เลขต้องเป็นตัวเลข
    BadFilter:
      description: ตัวกรองไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_FILTER
              message: ตัวกรองไม่ถูกต้อง
    BadStatus:
      description: ค่าสถานะหรือบทบาทไม่อยู่ในรายการที่อนุญาต
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_STATUS
              message: ค่าสถานะไม่ถูกต้อง
    MissingField:
      description: ข้อมูลไม่ครบหรือรูปแบบผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: MISSING_FIELD
              message: กรอกข้อมูลไม่ครบ
    Unauthorized:
      description: ไม่ได้แนบตั๋ว (LOGIN_REQUIRED) หรือตั๋วใช้ไม่ได้/หมดอายุ (TOKEN_INVALID)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: LOGIN_REQUIRED
              message: กรุณาเข้าสู่ระบบก่อน
    Forbidden:
      description: บทบาทไม่มีสิทธิ์ทำรายการนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้
    NotFound:
      description: ไม่พบรายการ หรือไม่ใช่ของคุณ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบรายการนี้
    WrongStatus:
      description: สถานะปัจจุบันไม่อนุญาตให้ทำรายการนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: WRONG_STATUS
              message: สถานะของรายการไม่อนุญาตให้ทำรายการนี้
    Duplicate:
      description: ข้อมูลซ้ำกับที่มีอยู่แล้ว (เส้นทางต้นทาง-ปลายทางเดิม หรือทะเบียนรถเดิม)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE
              message: ข้อมูลนี้มีอยู่แล้ว
    InUse:
      description: ยังมีข้อมูลอื่นอ้างถึงอยู่ ลบไม่ได้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: IN_USE
              message: มีรอบรถใช้รายการนี้อยู่ ลบไม่ได้
    VehicleBusy:
      description: รถคันนี้มีรอบออกเวลานั้นอยู่แล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VEHICLE_BUSY
              message: รถคันนี้มีรอบออกเวลานี้อยู่แล้ว

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: ไม่พบรายการนี้

    # ---------- Auth ----------
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          example: nida@example.com
        password:
          type: string
          minLength: 8
          example: password123
        displayName:
          type: string
          maxLength: 50
          example: นิดา
        phone:
          type: string
          nullable: true
          example: "0898765432"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: nida@example.com
        password:
          type: string
          example: password123
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: password123
        newPassword:
          type: string
          minLength: 8
          example: newpass456
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoibWVtYmVyIn0.sig
        member:
          $ref: "#/components/schemas/Member"
    Member:
      type: object
      properties:
        id:
          type: integer
          example: 3
        email:
          type: string
          example: nida@example.com
        displayName:
          type: string
          example: นิดา
        phone:
          type: string
          nullable: true
          example: "0898765432"
        role:
          type: string
          enum: [member, staff, admin]
          example: member
    Person:
      description: ข้อมูลคนโพสต์แบบย่อ phone เป็น null ถ้าคนดูยังไม่ได้เข้าสู่ระบบ
      type: object
      properties:
        id:
          type: integer
          example: 3
        displayName:
          type: string
          example: นิดา
        phone:
          type: string
          nullable: true
          example: "0898765432"

    # ---------- Trips ----------
    RouteInput:
      type: object
      required: [origin, destination, durationMin]
      properties:
        origin:
          type: string
          maxLength: 100
          example: กรุงเทพฯ (หมอชิต)
        destination:
          type: string
          maxLength: 100
          description: ต้องไม่ซ้ำกับต้นทาง
          example: นครปฐม
        durationMin:
          type: integer
          minimum: 1
          example: 60
    Route:
      type: object
      properties:
        id:
          type: integer
          example: 1
        origin:
          type: string
          example: กรุงเทพฯ (หมอชิต)
        destination:
          type: string
          example: นครปฐม
        durationMin:
          type: integer
          description: เวลาเดินทางโดยประมาณ (นาที)
          example: 60
    VehicleKind:
      type: string
      enum: [van, bus]
      description: van = รถตู้ (3 ที่ต่อแถว), bus = รถทัวร์ (2+2 มีทางเดินกลาง)
      example: van
    VehicleInput:
      type: object
      required: [plate, kind, seatCount]
      properties:
        plate:
          type: string
          example: 10-1234 กทม
        kind:
          $ref: "#/components/schemas/VehicleKind"
        seatCount:
          type: integer
          minimum: 1
          maximum: 60
          example: 13
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          example: 1
        plate:
          type: string
          example: 10-1234 กทม
        kind:
          $ref: "#/components/schemas/VehicleKind"
        seatCount:
          type: integer
          example: 13
    NewTrip:
      type: object
      required: [routeId, vehicleId, departAt, priceBaht]
      properties:
        routeId:
          type: integer
          example: 1
        vehicleId:
          type: integer
          example: 1
        departAt:
          type: string
          format: date-time
          example: "2026-10-21T07:00:00+07:00"
        priceBaht:
          type: integer
          minimum: 0
          example: 80
    TripPatch:
      type: object
      required: [departAt, priceBaht]
      properties:
        departAt:
          type: string
          format: date-time
          example: "2026-10-21T07:30:00+07:00"
        priceBaht:
          type: integer
          minimum: 0
          example: 90
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1
        route:
          $ref: "#/components/schemas/Route"
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        departAt:
          type: string
          format: date-time
          example: "2026-10-21T07:00:00+07:00"
        arriveAt:
          type: string
          format: date-time
          description: departAt + route.durationMin (ประมาณการ)
          example: "2026-10-21T08:00:00+07:00"
        priceBaht:
          type: integer
          example: 80
        status:
          type: string
          enum: [scheduled, cancelled]
          example: scheduled
        departed:
          type: boolean
          description: true = เลยเวลาออกแล้ว จองหรือยกเลิกไม่ได้
          example: false
        seatsLeft:
          type: integer
          example: 10
    TripPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          example: 7
    SeatMap:
      type: object
      properties:
        tripId:
          type: integer
          example: 1
        kind:
          $ref: "#/components/schemas/VehicleKind"
        seatCount:
          type: integer
          example: 13
        taken:
          type: array
          description: เลขที่นั่งที่ไม่ว่าง เรียงจากน้อยไปมาก
          items:
            type: integer
          example: [1, 2, 5]

    # ---------- Bookings ----------
    NewBooking:
      type: object
      required: [tripId, seats]
      properties:
        tripId:
          type: integer
          example: 1
        seats:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          example: [3, 4]
    Stats:
      type: object
      properties:
        today:
          type: string
          format: date
          example: "2026-10-28"
        bookingsToday:
          type: integer
          description: การจองที่เกิดวันนี้และยังไม่ยกเลิก
        seatsToday:
          type: integer
        revenueTodayBaht:
          type: integer
        upcomingTrips:
          type: integer
          description: รอบที่เปิดขายและจะออกภายใน 7 วัน
        daily:
          type: array
          description: 7 วันล่าสุด เก่าไปใหม่ วันสุดท้ายคือวันนี้
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              confirmed:
                type: integer
              cancelled:
                type: integer
        recentBookings:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Booking"
              - type: object
                properties:
                  member:
                    $ref: "#/components/schemas/Person"
        nextTrips:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        trip:
          $ref: "#/components/schemas/Trip"
        seats:
          type: array
          items:
            type: integer
          example: [1, 2]
        totalBaht:
          type: integer
          description: ราคาตอนจอง x จำนวนที่นั่ง
          example: 160
        status:
          type: string
          enum: [confirmed, cancelled]
          example: confirmed
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-20T10:00:00+07:00"
    BookingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          example: 2
    Passenger:
      description: หนึ่งการจองในรายชื่อผู้โดยสาร
      type: object
      properties:
        bookingId:
          type: integer
          example: 1
        member:
          $ref: "#/components/schemas/Person"
        seats:
          type: array
          items:
            type: integer
          example: [1, 2]
        totalBaht:
          type: integer
          example: 160
        createdAt:
          type: string
          format: date-time
          example: "2026-10-20T10:00:00+07:00"

    # ---------- Articles ----------
    ArticleInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 200
          example: เปิดเส้นทางใหม่ กรุงเทพฯ – หัวหิน
        body:
          type: string
          example: เริ่มให้บริการทุกวัน วันละ 2 รอบ ...
        coverUrl:
          type: string
          nullable: true
          description: ต้องขึ้นต้นด้วย http:// หรือ https:// ส่งว่างหรือ null = ไม่มีรูป
          example: null
        published:
          type: boolean
          example: true
    Article:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author:
          $ref: "#/components/schemas/Person"
        title:
          type: string
          example: เปิดเส้นทางใหม่ กรุงเทพฯ – หัวหิน
        body:
          type: string
          example: เริ่มให้บริการทุกวัน วันละ 2 รอบ ...
        coverUrl:
          type: string
          nullable: true
          example: null
        published:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-10T09:00:00+07:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-10T09:00:00+07:00"
    ArticleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          description: จำนวนทั้งหมดที่ตรงคำค้น (ทุกหน้ารวมกัน) จำนวนหน้า = ceil(total / pageSize)
          example: 2
